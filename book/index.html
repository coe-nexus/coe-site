<style>
:root{
  --navy:#1B2A4A; --azure:#598AC1; --coral:#E8734A;
  --cream:#FBF8F1; --sand:#D2C0B3; --gold:#C9A84C;
  --slate:#5A6B7D; --mist:#8A95A5; --border:#E7DFD3;
  --f-display:'Comfortaa',system-ui,sans-serif;
  --f-body:'DM Sans','Rethink Sans','Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f-body);background:var(--navy);color:var(--cream);
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:760px;margin:0 auto;padding:0 24px;width:100%}
h1,h2{font-family:var(--f-display);font-weight:600;line-height:1.2}
a{color:var(--azure)}

header.top{padding:28px 0}
header.top .mark{font-family:var(--f-display);font-weight:600;font-size:18px;
  color:var(--cream);text-decoration:none}

main{flex:1;padding:20px 0 60px}
.intro{text-align:center;max-width:52ch;margin:0 auto 30px}
.eyebrow{font-family:var(--f-body);text-transform:uppercase;letter-spacing:.14em;
  font-size:12px;color:var(--coral);font-weight:600;display:block;margin-bottom:12px}
h1{font-size:clamp(26px,4.2vw,38px);margin-bottom:14px}
.sub{color:rgba(251,248,241,.82);font-size:17px}

.embed-shell{background:var(--cream);border-radius:18px;overflow:hidden;
  border:1px solid rgba(251,248,241,.14)}
.embed-shell iframe{display:block;width:100%;border:0}

footer{padding:28px 0;text-align:center;color:var(--mist);font-size:13px}
footer .mark{font-family:var(--f-display);color:var(--sand);font-weight:600}
</style>

  <span class="mark">Covenant of Education</span> · coveofedu.org

<script src="https://embed.acuityscheduling.com/js/embed.js" type="text/javascript"></script>

<!--
  When Acuity confirms a booking, its conversion-tracking box posts a message
  up to this page. We listen for it and redirect to /thank-you. The redirect
  works here (not on the as.me page) because this is our own page — no sandbox.
  Requires the matching snippet pasted in Acuity: Integrations -> Custom
  conversion tracking:
    <script>window.parent.parent.postMessage(JSON.stringify({event:"AcuityEvent",ID:"%id%"}),"*");<\/script>
-->
<script>
  window.addEventListener('message', function(ev){
    var data;
    try { data = JSON.parse(ev.data); } catch(e){ return; }
    if (data && data.event === 'AcuityEvent') {
      window.location.href = '/thank-you';
    }
  });
</script>
</body>
