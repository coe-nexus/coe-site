<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Are Enough — Covenant of Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=Frank+Ruhl+Libre:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A4A; --navy-deep:#0F1A2E;
  --gold:#C9A84C; --gold-deep:#B0902F; --gold-light:#E0C572;
  --coral:#E8734A; --cream:#FBF8F1;
  --text-dark:#2C3E50; --text-mid:#5A6B7D; --text-light:#8A95A5;
  --peach:#FEF0E8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'DM Sans',sans-serif; color:var(--text-mid);
  background:linear-gradient(168deg, #FBF8F1 0%, #FFFFFF 52%, #FEF0E8 100%);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
a,button{cursor:pointer;}
::selection{background:rgba(201,168,76,0.25);color:var(--navy);}

/* ── stage ── */
.stage{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;}
.ambient{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 720px 470px at 16% 22%, rgba(201,168,76,0.18) 0%, transparent 62%),
    radial-gradient(ellipse 560px 560px at 84% 80%, rgba(232,115,74,0.12) 0%, transparent 62%),
    radial-gradient(ellipse 900px 380px at 50% 48%, rgba(201,168,76,0.06) 0%, transparent 72%);
  animation:drift 24s ease-in-out infinite;
}
.vignette{position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 76% 72% at 50% 44%, transparent 58%, rgba(27,42,74,0.07) 100%);}
.particles{position:absolute; inset:0; pointer-events:none; z-index:1;}
.p{position:absolute; border-radius:50%; background:var(--gold); bottom:0; opacity:0; box-shadow:0 0 6px rgba(201,168,76,0.55);}

/* ── card ── */
.card{
  position:relative; z-index:2;
  width:min(620px, calc(100vw - 44px));
  max-height:calc(100vh - 130px); overflow-y:auto;
  background:rgba(255,255,255,0.72);
  border:1px solid rgba(201,168,76,0.3);
  border-radius:20px; padding:52px 48px 44px;
  backdrop-filter:blur(12px);
  box-shadow:0 30px 80px rgba(27,42,74,0.13), 0 4px 16px rgba(27,42,74,0.05), inset 0 1px 0 rgba(255,255,255,0.7);
  transition:opacity .34s ease, transform .34s ease;
}
.card::-webkit-scrollbar{width:4px;}
.card::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.3);border-radius:2px;}
.card.out{opacity:0; transform:translateY(14px);}

.star{font-size:22px; color:var(--gold); display:block; margin-bottom:22px;
  animation:glow 3.8s ease-in-out infinite; text-shadow:0 0 22px rgba(201,168,76,0.5);}
.brand{display:flex; align-items:center; justify-content:flex-start; gap:11px; margin-bottom:18px;}
.brand-dove{height:34px; width:auto; display:inline-block; filter:drop-shadow(0 0 10px rgba(201,168,76,0.4));}
.brand-word{font-family:'Playfair Display',serif; font-size:18px; font-weight:600; color:var(--navy); letter-spacing:.2px;}
.hashtag{font-size:12.5px; font-weight:700; letter-spacing:.07em; color:var(--gold-deep); margin-bottom:14px;}
.steplabel{font-size:11px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--text-light); margin-bottom:18px;}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:14px;}
.headline{
  font-family:'Playfair Display',serif; font-weight:400;
  font-size:clamp(24px, 4.4vw, 33px); line-height:1.32; color:var(--navy);
  letter-spacing:-0.01em; margin-bottom:20px;
}
.headline em{font-style:italic; color:var(--coral);}
.body{font-size:clamp(15px,2.4vw,16.5px); font-weight:400; line-height:1.85; color:var(--text-mid);}
.body strong{color:var(--navy); font-weight:600;}
.body + .body{margin-top:14px;}

.names{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
.name-chip{font-size:13px; color:var(--navy); padding:7px 16px; border:1px solid rgba(201,168,76,0.4);
  border-radius:100px; background:rgba(201,168,76,0.08);}

/* ── scripture verse ── */
.verse{margin-top:30px; padding-top:26px; border-top:1px solid rgba(201,168,76,0.28); text-align:center;}
.verse-he{font-family:'Frank Ruhl Libre',serif; direction:rtl; font-weight:500;
  font-size:clamp(17px,2.7vw,21px); line-height:1.95; color:var(--navy);}
.verse-en{font-family:'Playfair Display',serif; font-style:italic; font-size:14px;
  color:var(--text-mid); line-height:1.65; margin-top:14px;}
.verse-cite{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--gold-deep); margin-top:11px; font-family:'DM Sans',sans-serif;}
.cnote{font-size:12.5px; color:var(--text-light); margin:0 0 18px; line-height:1.6;}

/* ── proof slide: accordion + before/after + share ── */
.hint{font-size:13px; color:var(--text-light); margin:2px 0 22px; line-height:1.5;}
.acc{display:flex; flex-direction:column; gap:13px;}
.acc-item{border:1px solid rgba(201,168,76,0.28); border-left:3px solid var(--gold);
  border-radius:13px; background:rgba(201,168,76,0.05); overflow:hidden; transition:background .25s;}
.acc-item.open{background:rgba(201,168,76,0.07);}
.acc-head{display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer;}
.acc-head:hover{background:rgba(201,168,76,0.06);}
.acc-textwrap{flex:1;}
.acc-name{font-family:'Playfair Display',serif; font-size:19px; font-weight:600; color:var(--navy);}
.acc-teaser{font-size:12.5px; color:var(--text-mid); margin-top:3px; line-height:1.45;}
.acc-plus{width:30px; height:30px; flex-shrink:0; border-radius:50%; border:1px solid rgba(201,168,76,0.45);
  display:flex; align-items:center; justify-content:center; color:var(--gold-deep); font-size:20px; line-height:1;
  transition:transform .35s ease, background .25s, color .25s, border-color .25s;}
.acc-item.open .acc-plus{transform:rotate(45deg); background:var(--gold); color:#fff; border-color:var(--gold);}
.acc-body{max-height:0; opacity:0; overflow:hidden; padding:0 18px;
  transition:max-height .5s ease, opacity .4s ease, padding .4s ease;}
.acc-item.open .acc-body{max-height:1600px; opacity:1; padding:2px 18px 18px;}
.acc-body p{font-size:14.5px; line-height:1.78; color:var(--text-mid); margin-bottom:12px;}
.acc-body p.punch{color:var(--navy); font-weight:500;}
.acc-quote{font-family:'Playfair Display',serif; font-style:italic; font-size:15px; color:var(--navy);
  border-left:2px solid var(--gold); padding-left:15px; margin:16px 0; line-height:1.6;}
.ba{background:rgba(255,255,255,0.62); border:1px solid rgba(201,168,76,0.22); border-radius:12px;
  padding:6px 16px; margin-top:16px;}
.ba-row{display:flex; gap:14px; padding:11px 0; align-items:baseline;}
.ba-row + .ba-row{border-top:1px solid rgba(27,42,74,0.07);}
.ba-k{font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--gold-deep); min-width:64px; flex-shrink:0;}
.ba-v{font-size:14px; color:var(--navy); line-height:1.5;}
.share{margin-top:28px; padding-top:24px; border-top:1px solid rgba(201,168,76,0.28);}
.share-k{font-size:11px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:14px;}
.share p{font-size:14.5px; line-height:1.78; color:var(--text-mid); margin-bottom:12px;}
.share .key{font-family:'Playfair Display',serif; font-style:italic; color:var(--navy); font-size:16.5px; line-height:1.5;}

/* ── nav ── */
.nav{display:flex; align-items:center; gap:12px; margin-top:34px;}
.next{background:var(--gold); color:var(--navy); border:none; border-radius:100px;
  padding:13px 36px; font-size:14px; font-weight:700; letter-spacing:.3px; font-family:'DM Sans',sans-serif;
  margin-left:auto; box-shadow:0 6px 22px rgba(201,168,76,0.32); transition:transform .2s, box-shadow .2s, background .2s, color .2s;}
.next:hover{transform:translateY(-1px); background:var(--gold-deep); color:#fff; box-shadow:0 8px 28px rgba(201,168,76,0.4);}
.back{background:none; border:1px solid rgba(201,168,76,0.35); border-radius:100px; color:var(--gold-deep);
  width:42px; height:42px; font-size:17px; display:flex; align-items:center; justify-content:center; transition:.2s;}
.back:hover{border-color:var(--gold); background:rgba(201,168,76,0.08);}

/* ── film slide ── */
.film-still{position:relative; border-radius:14px; overflow:hidden; aspect-ratio:16/9; margin:8px 0 26px;
  background:linear-gradient(135deg,#243a5e,#0f1a2e); display:flex; align-items:center; justify-content:center;
  box-shadow:0 14px 40px rgba(27,42,74,0.22);}
.film-still::after{content:'REDEMPTION · A SHORT FILM · 12 MIN'; position:absolute; bottom:13px; left:0; right:0;
  text-align:center; font-size:10px; letter-spacing:2.4px; color:rgba(255,255,255,0.5);}
.play{width:70px; height:70px; border-radius:50%; background:rgba(201,168,76,0.96); display:flex;
  align-items:center; justify-content:center; box-shadow:0 8px 30px rgba(201,168,76,0.45);}
.optin{display:flex; gap:10px; margin-top:4px;}
.optin input{flex:1; padding:14px 18px; border-radius:100px; border:1px solid rgba(27,42,74,0.16);
  background:rgba(27,42,74,0.03); color:var(--navy); font-family:'DM Sans',sans-serif; font-size:15px;}
.optin input::placeholder{color:var(--text-light);}
.optin input:focus{outline:none; border-color:var(--gold);}
.optin button{background:var(--coral); color:#fff; border:none; border-radius:100px; padding:14px 26px;
  font-weight:700; font-size:15px; white-space:nowrap; font-family:'DM Sans',sans-serif; transition:.2s;
  box-shadow:0 6px 20px rgba(232,115,74,0.3);}
.optin button:hover{background:#D4622F;}
.optin-note{font-size:12px; color:var(--text-light); margin-top:14px;}
.done-text{display:block;}
.optin-link{display:inline-block; margin-top:12px; font-size:14px; font-weight:600; color:var(--gold-deep); text-decoration:none; border-bottom:1px solid rgba(176,144,47,0.45); padding-bottom:2px;}
.optin-link:hover{color:var(--coral); border-color:var(--coral);}
.optin-done{display:none; color:var(--navy); font-size:16px; padding:8px 0; font-weight:500;}
.optin-done.show{display:block;}
.give{margin-top:24px; font-size:14px; color:var(--text-mid);}
.give a{color:var(--coral); text-decoration:none; border-bottom:1px solid rgba(232,115,74,0.4); padding-bottom:1px;}

/* ── dots + crisis ── */
.dots{position:fixed; bottom:56px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:5;}
.dot{width:7px; height:7px; border-radius:50%; background:rgba(27,42,74,0.18); transition:all .35s ease;}
.dot.active{background:var(--gold); transform:scale(1.35); box-shadow:0 0 10px rgba(201,168,76,0.5);}
.crisis{position:fixed; bottom:20px; left:0; right:0; text-align:center; z-index:5;
  font-size:11px; color:var(--text-light); padding:0 20px;}
.crisis b{color:var(--text-mid);}

@keyframes drift{0%{transform:translate(0,0)}33%{transform:translate(24px,-16px)}66%{transform:translate(-16px,12px)}100%{transform:translate(0,0)}}
@keyframes glow{0%,100%{opacity:.55; transform:scale(1)}50%{opacity:1; transform:scale(1.16)}}
@keyframes rise{0%{opacity:0; transform:translateY(0) scale(.5)}14%{opacity:.7; transform:translateY(-12vh) scale(1)}80%{opacity:.35}100%{opacity:0; transform:translateY(-100vh) scale(.3)}}
@keyframes fadeIn{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:translateY(0)}}
.card{animation:fadeIn .55s ease;}

@media(max-width:600px){ .card{padding:40px 26px 34px;} .dots{bottom:48px;} }
</style>
</head>
<body>
<div class="stage">
  <div class="ambient"></div>
  <div class="vignette"></div>
  <div class="particles" id="particles"></div>

  <div class="card" id="card"></div>
  <iframe name="bd-sink" title="subscribe" aria-hidden="true" style="position:absolute;width:0;height:0;border:0;visibility:hidden"></iframe>

  <div class="dots" id="dots"></div>
  <div class="crisis">In crisis? In the U.S. call or text <b>988</b> · worldwide <b>findahelpline.com</b></div>
</div>

<script>
const SLIDES = [
  {
    headline:"You can see it in your child. They <em>can't</em> — yet.",
    body:["You've tried the therapy, the tutoring, the talks. And you can still see the thing in them they can't see in themselves. That gap is the most painful distance a parent ever measures."]
  },
  {
    headline:"Your child isn't broken.",
    body:["But a bright kid can still disappear — quietly, into a screen, a closed door, a silence no report card will ever catch.",
          "<strong>They don't need to be fixed. They need to be shown</strong> — the thing inside them everyone else can see but they can't."]
  },
  {
    eyebrow:"How we make it better",
    headline:"We don't tell your child what to think. We hand them <em>perspective</em>.",
    body:["Every institution in their life already tells them who to be. We do the opposite.",
          "We help your child see themselves from an angle of love instead of fear — until they know, in their bones, that <strong>they are enough</strong>."]
  },
  {
    eyebrow:"Proof it works",
    headline:"They couldn't see it. Neither could anyone else.",
    extra:`<p class="hint">Tap a name to read the whole story.</p>

    <div class="acc">

      <!-- ELLY -->
      <div class="acc-item" id="elly">
        <div class="acc-head" onclick="toggle('elly')">
          <div class="acc-textwrap">
            <div class="acc-name">Elly</div>
            <div class="acc-teaser">Jobless and weeks from eviction → director, developer, award nominee — in six months.</div>
          </div>
          <div class="acc-plus">+</div>
        </div>
        <div class="acc-body">
          <p>Elly was jobless and nearly out of money, communicating through a broken laptop on WhatsApp because she couldn't afford a phone. She was looking for work as a minimum-wage nanny, and weeks from being evicted for unpaid rent.</p>
          <p class="punch">Within 10 weeks of structured mentorship through the 7 Teachings, she directed and produced her first documentary. Shot in 6K. Hired her own videographers. Rented equipment she'd never touched. Edited on software she'd never opened.</p>
          <p>None of this was on her radar. Not dormant. Not buried. Nonexistent. She had never once imagined herself behind a camera.</p>
          <p>What happened in between was a sequence of small challenges designed to surface capabilities she didn't know she had — editing in Descript, working with scripts, locations, lighting. Each one slightly past the edge of what she believed she could do. Each one proving the belief wrong.</p>
          <p>Within six months she had built a coded media app for kids using Claude Code, found her own clients beyond nanny work, and was selected for a Brazilian voice-talent award.</p>
          <div class="acc-quote">"If not for Izzy and the 7 Teachings, I wouldn't have found the confidence to try programming and build a product on my own."</div>
          <div class="ba">
            <div class="ba-row"><span class="ba-k">Before</span><span class="ba-v">Broken laptop. No phone. Searching for minimum-wage work.</span></div>
            <div class="ba-row"><span class="ba-k">After</span><span class="ba-v">Director. Developer. Award nominee. Building her own client base.</span></div>
            <div class="ba-row"><span class="ba-k">Timeline</span><span class="ba-v">Six months.</span></div>
          </div>
        </div>
      </div>

      <!-- DIMASH -->
      <div class="acc-item" id="dimash">
        <div class="acc-head" onclick="toggle('dimash')">
          <div class="acc-textwrap">
            <div class="acc-name">Dimash</div>
            <div class="acc-teaser">Depressed and copy-pasting through school → full scholarship to a top-tier university.</div>
          </div>
          <div class="acc-plus">+</div>
        </div>
        <div class="acc-body">
          <p>Dimash was depressed, copy-pasting his way through classes in Kazakhstan. Addicted to video games. Surrounded by classmates going nowhere. His parents were divorced, both relationships strained. He didn't believe he could get into any school beyond a small local community college — let alone earn a scholarship abroad. A full ride wasn't a stretch goal. It was unthinkable.</p>
          <p class="punch">Rather than treating him as a student, Izzy brought him in as a working partner. Real client work for American tech companies. Negotiation rooms where he had to hold his own against professionals three times his age.</p>
          <p>Within six months he was building his own software products. Not school projects — actual tools solving real problems for real users.</p>
          <p>When it came time for university applications, he refused help with his essays. He told his mother: "No one can say it better about me than I can myself."</p>
          <p>SAT: 1540. He applied to MIT, KAIST, and top programs in Hong Kong and Singapore — every essay written from genuine self-knowledge, not performance.</p>
          <p>Twelve months after his last session with Izzy, he was accepted on a full scholarship to CUHK's financial-engineering program, one of the strongest in Asia. He's there now, on his way to becoming a quantitative trader.</p>
          <div class="acc-quote">"Without Izzy, he would have been lost — he would never have uncovered his true talent or seen himself for what he is capable of." — his mother</div>
          <div class="ba">
            <div class="ba-row"><span class="ba-k">Before</span><span class="ba-v">Depressed. Copy-pasting through school. Couldn't imagine a future beyond his zip code.</span></div>
            <div class="ba-row"><span class="ba-k">After</span><span class="ba-v">Full scholarship. Top-tier university. Building a career in quantitative finance.</span></div>
            <div class="ba-row"><span class="ba-k">Timeline</span><span class="ba-v">Eighteen months, first session to acceptance letter.</span></div>
          </div>
        </div>
      </div>

    </div>

    <div class="share">
      <div class="share-k">What both stories share</div>
      <p>Neither Elly nor Dimash received therapy. Neither was "fixed."</p>
      <p class="key">Self-acceptance was the door. Everything else walked through it.</p>
      <p>Both were handed a structured framework for discovering capabilities that were already present — but invisible to them.</p>
    </div>`
  },
  {
    eyebrow:"Why this exists",
    headline:"It begins with a letter that was never sent.",
    body:["Before any of this, there were two brothers. One was failing, ready to give up. The other gave him everything he had — while quietly carrying a darkness no one could see.",
          "What he asked for in return was almost nothing. A card in the mail. It was bought. It was written. It was never sent."]
  },
  {
    headline:"That letter was never sent by our founder Izzy.",
    body:["He didn't get to send it in time. So now he pays the love forward to the next kid that needs it — to the young people who have never once been told they are enough.",
          "He calls it a covenant. We call it COE. Either way, it's just love, passed on."],
    verse:{
      he:"וָאֶעֱבֹר עָלַיִךְ וָאֶרְאֵךְ מִתְבּוֹסֶסֶת בְּדָמָיִךְ וָאֹמַר לָךְ בְּדָמַיִךְ חֲיִי וָאֹמַר לָךְ בְּדָמַיִךְ חֲיִי",
      en:"And I passed by you, and saw you cast down in your blood, and I said to you: in your blood, live. And I said to you: in your blood, live.",
      cite:"Ezekiel 16:6"
    }
  },
  {
    eyebrow:"Hear the whole story",
    headline:"Watch <em>Redemption</em>.",
    body:["A short film about a brother, the love that outlived him, and the kids it was built to catch. It will ask something of you — to be there for someone the way Izzy's brother saw him. To really see someone for all they are worth, and give them the chance to grow under your love.",
          "It says all of this better than a page ever could."],
    cnote:"A note before you begin: the film touches on suicide and loss. If now isn't the time, that's okay.",
    film:true
  }
];

const card = document.getElementById('card');
const dotsEl = document.getElementById('dots');
let step = 0;

function toggle(id){ const el=document.getElementById(id); if(el) el.classList.toggle('open'); }

// build dots
SLIDES.forEach((_,i)=>{ const d=document.createElement('div'); d.className='dot'; dotsEl.appendChild(d); });
const dots = [...dotsEl.children];

// particles
const pf = document.getElementById('particles');
for(let i=0;i<16;i++){
  const s=2+Math.random()*3, dur=5+Math.random()*6, delay=i*0.8;
  const el=document.createElement('div'); el.className='p';
  el.style.cssText=`width:${s}px;height:${s}px;left:${5+(i*5.8)%90}%;animation:rise ${dur}s ease-out ${delay}s infinite;`;
  pf.appendChild(el);
}

function render(){
  const s = SLIDES[step];
  const last = step === SLIDES.length-1;

function go(dir){
  const t = step+dir;
  if(t<0 || t>=SLIDES.length) return;
  card.classList.add('out');
  setTimeout(()=>{ step=t; render(); card.classList.remove('out'); }, 300);
}

function submitOptin(){
  var email=document.getElementById('email').value.trim();
  if(!email||email.indexOf('@')<1){ document.getElementById('email').focus(); return false; }

  return true;
}

document.addEventListener('keydown', e=>{

});
